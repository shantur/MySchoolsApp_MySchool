      - name: Build Next.js application
        run: npm run build

      - name: Build Cloud Functions for deployment
        run: npm run build:functions

      - name: Verify Cloud Functions build artifacts
        run: |
          echo "✅ Verifying Cloud Functions build artifacts..."
          if [ ! -f "functions/lib/index.js" ]; then
            echo "❌ ERROR: functions/lib/index.js does not exist!"
            echo "Contents of functions directory:"
            ls -la functions/
            echo ""
            echo "Contents of functions/lib directory (if exists):"
            ls -la functions/lib/ || echo "functions/lib/ directory does not exist"
            exit 1
          fi
          echo "✅ Cloud Functions compiled successfully"
          ls -lh functions/lib/index.js
          
          # Verify firebase-functions is installed
          if [ ! -d "functions/node_modules/firebase-functions" ]; then
            echo "❌ ERROR: firebase-functions package not found in functions/node_modules/"
            exit 1
          fi
          echo "✅ firebase-functions package verified"
          
          # Verify firebase-functions is in package.json dependencies
          if ! grep -q '"firebase-functions"' functions/package.json; then
            echo "❌ ERROR: firebase-functions not found in package.json dependencies"
            exit 1
          fi
          echo "✅ firebase-functions in package.json"
          
          # Show firebase-functions version
          cd functions && npm list firebase-functions && cd ..
          echo "✅ All build artifacts verified"

      - name: Check deployment size
        run: |
          SIZE_MB=$(du -sm functions | cut -f1)
          echo "Deployment size: ${SIZE_MB}MB"
          echo "DEPLOYMENT_SIZE_MB=${SIZE_MB}" >> $GITHUB_ENV
          
          if [ $SIZE_MB -gt ${{ env.DEPLOYMENT_SIZE_THRESHOLD_MB }} ]; then
            echo "Error: Deployment size exceeds ${{ env.DEPLOYMENT_SIZE_THRESHOLD_MB }}MB threshold"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            functions/
            .next/
            public/
            package.json
            firebase.json
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            functions/coverage/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # Job 2: Deploy to Firebase
  deploy-firebase:
    name: Deploy to Firebase
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    strategy:
      matrix:
        environment: 
          - ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Rebuild application for deployment
        run: |
          echo "🔨 Rebuilding Next.js and Cloud Functions for deployment..."
          
          # Step 1: Build Next.js (fresh build in case artifacts are stale)
          echo "Building Next.js application..."
          npm run build
          
          # Step 2: Run full build:functions to prepare deployment package
          echo "Preparing Cloud Functions deployment package..."
          npm run build:functions
          
          # Step 3: Verify all required artifacts exist
          echo "Verifying build artifacts..."
          
          if [ ! -d "functions/.next" ]; then
            echo "❌ ERROR: functions/.next directory not found"
            exit 1
          fi
          
          if [ ! -f "functions/lib/index.js" ]; then
            echo "❌ ERROR: functions/lib/index.js not found"
            exit 1
          fi
          
          if [ ! -d "functions/node_modules/firebase-functions" ]; then
            echo "❌ ERROR: firebase-functions not found in functions/node_modules"
            exit 1
          fi
          
          echo "✅ All deployment artifacts verified:"
          echo "  - Next.js build: $(ls -d functions/.next)"
          echo "  - Cloud Functions: $(ls functions/lib/index.js)"
          echo "  - firebase-functions: $(cd functions && npm list firebase-functions 2>&1 | grep firebase-functions)"
          echo "  - Deployment size: $(du -sh functions | cut -f1)"

      - name: Determine Firebase project
        run: |
          if [ "${{ matrix.environment }}" == "production" ]; then
            echo "FIREBASE_PROJECT=${{ env.FIREBASE_PROJECT_PROD }}" >> $GITHUB_ENV
          elif [ "${{ matrix.environment }}" == "staging" ]; then
            echo "FIREBASE_PROJECT=${{ env.FIREBASE_PROJECT_STAGING }}" >> $GITHUB_ENV
          else
            echo "FIREBASE_PROJECT=${{ env.FIREBASE_PROJECT_DEV }}" >> $GITHUB_ENV
          fi
          echo "Deploying to Firebase project: $FIREBASE_PROJECT"

      - name: Configure Cloud Functions environment variables
        run: |
          echo "📝 Creating Cloud Functions .env.yaml from GitHub Secrets..."
          
          cat > functions/.env.yaml << 'EOF'
          # Cloud Functions Environment Variables (Auto-generated from GitHub Secrets)
          # DO NOT EDIT - This file is generated during deployment
          
          # Firebase Client SDK Configuration
          NEXT_PUBLIC_FIREBASE_API_KEY: "${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
          NEXT_PUBLIC_FIREBASE_APP_ID: "${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"
          
          # Application Configuration
          SESSION_SECRET: "${{ secrets.SESSION_SECRET }}"
          
          # Runtime Configuration
          USE_FIREBASE_EMULATORS: "false"
          NODE_ENV: "production"
          EOF
          
          echo "✅ Cloud Functions .env.yaml created"
          echo "📊 Environment variables configured:"
          echo "  - NEXT_PUBLIC_FIREBASE_API_KEY: $(echo '${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}' | cut -c1-10)..."
          echo "  - NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          echo "  - SESSION_SECRET: $(echo '${{ secrets.SESSION_SECRET }}' | cut -c1-10)... (${#SESSION_SECRET} characters)"
          echo "  - USE_FIREBASE_EMULATORS: false"
          echo "  - NODE_ENV: production"

      - name: Deploy to Firebase Hosting and Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,functions --non-interactive --force --debug 2>&1
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          PROJECT_ID: ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Firestore and Storage rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage --non-interactive --debug 2>&1
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          PROJECT_ID: ${{ env.FIREBASE_PROJECT }}

      - name: Post-deployment health check
        run: |
          # Wait a moment for deployment to propagate
          sleep 30
          
          # Get the hosting URL
          HOSTING_URL=$(firebase hosting:sites:list --project="$FIREBASE_PROJECT" --format="value(sites.defaultUrl)" | head -1)
          echo "Hosting URL: $HOSTING_URL"
          
          # Health check the deployed application
          if curl -f -s -o /dev/null -w "%{http_code}" "$HOSTING_URL" | grep -q "200"; then
            echo "✅ Deployment health check passed"
          else
            echo "❌ Deployment health check failed"
            exit 1
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Firebase Project:** $FIREBASE_PROJECT" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Size:** ${{ needs.test-and-build.outputs.DEPLOYMENT_SIZE_MB || 'Unknown' }}MB" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Steps" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Code checkout and dependency installation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Build artifact download" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Firebase environment configuration" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Firebase Hosting deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Firebase Functions deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Firestore and Storage rules deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Post-deployment health check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs" >> $GITHUB_STEP_SUMMARY
          HOSTING_URL=$(firebase hosting:sites:list --project="$FIREBASE_PROJECT" --format="value(sites.defaultUrl)" | head -1)
          echo "- **Application:** $HOSTING_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase Console:** https://console.firebase.google.com/project/$FIREBASE_PROJECT" >> $GITHUB_STEP_SUMMARY

  # Job 3: Notify on failure
  notify-on-failure:
    name: Notify on Failure
    needs: [test-and-build, deploy-firebase]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Create failure notification
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Failed Jobs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test-and-build.result }}" == "failure" ]; then
            echo "- [x] Test and Build: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-firebase.result }}" == "failure" ]; then
            echo "- [x] Deploy Firebase: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the failed job logs for detailed error information" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix the identified issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Push new commits or re-run the workflow" >> $GITHUB_STEP_SUMMARY