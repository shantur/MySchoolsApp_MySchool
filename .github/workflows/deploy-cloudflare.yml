# =============================================================================
# MySchoolWeb CI/CD Pipeline - Cloudflare Workers Deployment
# =============================================================================
# Version: 1.0.0
# Location: myschoolweb/.github/workflows/deploy-cloudflare.yml
# Implementation Date: 2025-10-15
# Task: tasks/task_001_firebase_to_supabase_conversion.md (Phase 8)
# Description: CI/CD pipeline for MySchoolWeb Next.js deployment to Cloudflare 
#              Workers using OpenNext.js with Supabase backend
#
# Prerequisites:
# - GitHub Environment 'staging' configured with required secrets
# - Wrangler CLI authenticated via GitHub Secrets
# - Supabase project provisioned with RLS policies
# - OpenNext.js installed as dev dependency
#
# Environment Variables Required (in GitHub Environment 'staging'):
# Secrets:
#   - SUPABASE_URL
#   - SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - SESSION_SECRET
# Variables:
#   - CLOUDFLARE_WORKERS_DEV_NAME (e.g., myschoolweb-dev)
#   - CLOUDFLARE_WORKERS_STAGING_NAME (e.g., myschoolweb-staging)
# =============================================================================

name: Deploy MySchoolWeb to Cloudflare Workers

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Global environment variables
env:
  NODE_VERSION: 20
  DEPLOYMENT_SIZE_THRESHOLD_MB: 5  # Cloudflare Workers paid plan limit
  OPENNEXT_VERSION: latest

jobs:
  # =============================================================================
  # Job 1: Build, Test, and Deploy
  # =============================================================================
  build-test-deploy:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'staging' }}
    
    steps:
      # -------------------------------------------------------------------------
      # Setup
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------------------
      # Code Quality Checks
      # -------------------------------------------------------------------------
      - name: Run ESLint
        run: npm run lint -- --max-warnings 50
        continue-on-error: false

      - name: TypeScript compilation check
        run: npx tsc --noEmit --skipLibCheck

      # -------------------------------------------------------------------------
      # Unit Tests
      # -------------------------------------------------------------------------
      - name: Run unit tests with coverage
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 14

      # -------------------------------------------------------------------------
      # Service Tests
      # -------------------------------------------------------------------------
      - name: Run service tests
        run: npm run test:service -- --runInBand --forceExit
        continue-on-error: false
        timeout-minutes: 5

      # -------------------------------------------------------------------------
      # Build Application
      # -------------------------------------------------------------------------
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          # Supabase configuration required for build-time data collection
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      # -------------------------------------------------------------------------
      # OpenNext.js Build for Cloudflare Workers
      # -------------------------------------------------------------------------
      - name: Build with OpenNext.js for Cloudflare Workers
        run: npm run build:opennext
        env:
          NODE_ENV: production
          # Supabase configuration for build-time checks
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Verify OpenNext.js build artifacts
        run: |
          echo "✅ Verifying OpenNext.js build artifacts..."
          
          if [ ! -d ".open-next" ]; then
            echo "❌ ERROR: .open-next directory does not exist!"
            exit 1
          fi
          
          if [ ! -f ".open-next/worker.js" ]; then
            echo "❌ ERROR: .open-next/worker.js does not exist!"
            echo "Contents of .open-next directory:"
            ls -la .open-next/
            exit 1
          fi
          
          echo "✅ OpenNext.js build artifacts verified:"
          echo "  - Worker entry: $(ls -lh .open-next/worker.js)"
          echo "  - Build structure:"
          tree .open-next -L 2 || ls -R .open-next

      # -------------------------------------------------------------------------
      # Size Check
      # -------------------------------------------------------------------------
      - name: Check deployment size
        id: check-size
        run: |
          SIZE_MB=$(du -sm .open-next | cut -f1)
          echo "Deployment size: ${SIZE_MB}MB"
          echo "size_mb=${SIZE_MB}" >> $GITHUB_OUTPUT
          
          if [ $SIZE_MB -gt ${{ env.DEPLOYMENT_SIZE_THRESHOLD_MB }} ]; then
            echo "⚠️ WARNING: Deployment size exceeds ${DEPLOYMENT_SIZE_THRESHOLD_MB}MB threshold"
            echo "This requires Cloudflare Workers Paid plan ($5/month)"
            echo "Free tier limit: 1MB, Paid tier limit: 5MB"
            # Don't fail - just warn, as paid plan may be configured
          else
            echo "✅ Deployment size within limits"
          fi

      # -------------------------------------------------------------------------
      # Determine Environment
      # -------------------------------------------------------------------------
      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "worker_name=myschoolweb-prod" >> $GITHUB_OUTPUT
            echo "config_file=wrangler.production.toml" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "worker_name=${{ vars.CLOUDFLARE_WORKERS_STAGING_NAME || 'myschoolweb-staging' }}" >> $GITHUB_OUTPUT
            echo "config_file=wrangler.staging.toml" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------------------
      # Update Wrangler Configuration
      # -------------------------------------------------------------------------
      - name: Configure Wrangler
        run: |
          echo "📝 Configuring Wrangler for ${{ steps.env.outputs.environment }} deployment..."
          
          # Create temporary wrangler configuration with GitHub Secrets
          cat > ${{ steps.env.outputs.config_file }} << 'EOF'
          # Auto-generated Wrangler configuration for ${{ steps.env.outputs.environment }} deployment
          # DO NOT EDIT - Generated during CI/CD deployment
          
          name = "${{ steps.env.outputs.worker_name }}"
          main = ".open-next/worker.js"
          compatibility_date = "2024-10-15"
          compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          # Configure assets directory for static files (CSS, JS, images)
          [assets]
          directory = "./.open-next/assets"
          binding = "ASSETS"
          
          [[routes]]
          pattern = "myschoolweb.myschools.app/*"
          zone_name = "myschools.app"
          
          [vars]
          NEXT_PUBLIC_SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          NODE_ENV = "${{ steps.env.outputs.environment }}"
          EOF
          
          echo "✅ Wrangler configuration created for ${{ steps.env.outputs.environment }}"
          echo "📊 Configuration:"
          echo "  - Worker Name: ${{ steps.env.outputs.worker_name }}"
          echo "  - Account ID: $(echo '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' | cut -c1-10)..."
          echo "  - Supabase URL: ${{ secrets.SUPABASE_URL }}"
          echo "  - Node Environment: ${{ steps.env.outputs.environment }}"

      # -------------------------------------------------------------------------
      # Configure Cloudflare Secrets
      # -------------------------------------------------------------------------
      - name: Set Cloudflare Worker secrets
        run: |
          echo "🔐 Configuring Cloudflare Worker secrets..."
          
          # Set SUPABASE_SERVICE_ROLE_KEY secret
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config ${{ steps.env.outputs.config_file }}
          
          # Set SESSION_SECRET secret
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET --config ${{ steps.env.outputs.config_file }}
          
          echo "✅ Cloudflare Worker secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Deploy to Cloudflare Workers
      # -------------------------------------------------------------------------
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ${{ steps.env.outputs.config_file }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Post-Deployment Verification
      # -------------------------------------------------------------------------
      - name: Post-deployment health check
        run: |
          echo "⏳ Waiting 30 seconds for deployment to propagate..."
          sleep 30
          
          WORKER_URL="https://myschoolweb.myschools.app"
          WORKER_DEV_URL="https://${{ steps.env.outputs.worker_name }}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          
          echo "🔍 Health checking custom domain: $WORKER_URL"
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$WORKER_URL" || echo "000")
          echo "Custom domain HTTP Response Code: $HTTP_CODE"
          
          echo "🔍 Health checking workers.dev URL: $WORKER_DEV_URL"
          HTTP_CODE_DEV=$(curl -f -s -o /dev/null -w "%{http_code}" "$WORKER_DEV_URL" || echo "000")
          echo "Workers.dev HTTP Response Code: $HTTP_CODE_DEV"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE_DEV" = "200" ]; then
            echo "✅ Deployment health check passed"
          else
            echo "⚠️ Deployment health check failed for both URLs"
            echo "Checking worker logs for errors..."
            npx wrangler tail --config ${{ steps.env.outputs.config_file }} --once || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # -------------------------------------------------------------------------
      # Create Deployment Summary
      # -------------------------------------------------------------------------
      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary - ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Name:** ${{ steps.env.outputs.worker_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Size:** ${{ steps.check-size.outputs.size_mb }}MB" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**OpenNext.js Version:** ${{ env.OPENNEXT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Steps" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Code quality checks (ESLint, TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Unit and service tests" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Next.js build" >> $GITHUB_STEP_SUMMARY
          echo "- [x] OpenNext.js build for Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Wrangler configuration" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Worker secrets configuration" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Cloudflare Workers deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Post-deployment health check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Application (Custom Domain):** https://myschoolweb.myschools.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Application (Workers.dev):** https://${{ steps.env.outputs.worker_name }}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloudflare Dashboard:** https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/${{ steps.env.outputs.worker_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Supabase Dashboard:** ${{ secrets.SUPABASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Logs:** \`npx wrangler tail --config ${{ steps.env.outputs.config_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Analytics:** [Cloudflare Dashboard](https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/${{ steps.env.outputs.worker_name }}/analytics)" >> $GITHUB_STEP_SUMMARY

      # -------------------------------------------------------------------------
      # Upload Test Results (if any failures)
      # -------------------------------------------------------------------------
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
