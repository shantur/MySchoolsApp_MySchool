# =============================================================================
# MySchoolWeb CI/CD Pipeline - Cloudflare Workers Deployment
# =============================================================================
# Version: 1.0.0
# Location: myschoolweb/.github/workflows/deploy-cloudflare.yml
# Implementation Date: 2025-10-15
# Task: tasks/task_001_firebase_to_supabase_conversion.md (Phase 8)
# Description: CI/CD pipeline for MySchoolWeb Next.js deployment to Cloudflare 
#              Workers using OpenNext.js with Supabase backend
#
# Prerequisites:
# - GitHub Environment 'staging' configured with required secrets
# - Wrangler CLI authenticated via GitHub Secrets
# - Supabase project provisioned with RLS policies
# - OpenNext.js installed as dev dependency
#
# Environment Variables Required (in GitHub Environment 'staging'):
# Secrets:
#   - SUPABASE_URL
#   - SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - SESSION_SECRET
# Variables:
#   - CLOUDFLARE_WORKERS_DEV_NAME (e.g., myschoolweb-dev)
#   - CLOUDFLARE_WORKERS_STAGING_NAME (e.g., myschoolweb-staging)
# =============================================================================

name: Deploy MySchoolWeb to Cloudflare Workers

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Global environment variables
env:
  NODE_VERSION: 20
  DEPLOYMENT_SIZE_THRESHOLD_MB: 5  # Cloudflare Workers paid plan limit
  OPENNEXT_VERSION: latest

jobs:
  # =============================================================================
  # Job 1: Build and Test
  # =============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    # Set deployment size as output for deploy job
    outputs:
      deployment_size_mb: ${{ steps.check-size.outputs.size_mb }}
    
    steps:
      # -------------------------------------------------------------------------
      # Setup
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------------------
      # Code Quality Checks
      # -------------------------------------------------------------------------
      - name: Run ESLint
        run: npm run lint -- --max-warnings 50
        continue-on-error: false

      - name: TypeScript compilation check
        run: npx tsc --noEmit --skipLibCheck

      # -------------------------------------------------------------------------
      # Unit Tests
      # -------------------------------------------------------------------------
      - name: Run unit tests with coverage
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 14

      # -------------------------------------------------------------------------
      # Service Tests
      # -------------------------------------------------------------------------
      - name: Run service tests
        run: npm run test:service -- --runInBand --forceExit
        continue-on-error: false
        timeout-minutes: 5

      # -------------------------------------------------------------------------
      # Build Application
      # -------------------------------------------------------------------------
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          # Supabase configuration required for build-time data collection
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      # -------------------------------------------------------------------------
      # OpenNext.js Build for Cloudflare Workers
      # -------------------------------------------------------------------------
      - name: Build with OpenNext.js for Cloudflare Workers
        run: npm run build:opennext
        env:
          NODE_ENV: production
          # Supabase configuration for build-time checks
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Verify OpenNext.js build artifacts
        run: |
          echo "✅ Verifying OpenNext.js build artifacts..."
          
          if [ ! -d ".open-next" ]; then
            echo "❌ ERROR: .open-next directory does not exist!"
            exit 1
          fi
          
          if [ ! -f ".open-next/worker.js" ]; then
            echo "❌ ERROR: .open-next/worker.js does not exist!"
            echo "Contents of .open-next directory:"
            ls -la .open-next/
            exit 1
          fi
          
          echo "✅ OpenNext.js build artifacts verified:"
          echo "  - Worker entry: $(ls -lh .open-next/worker.js)"
          echo "  - Build structure:"
          tree .open-next -L 2 || ls -R .open-next

      # -------------------------------------------------------------------------
      # Size Check
      # -------------------------------------------------------------------------
      - name: Check deployment size
        id: check-size
        run: |
          SIZE_MB=$(du -sm .open-next | cut -f1)
          echo "Deployment size: ${SIZE_MB}MB"
          echo "size_mb=${SIZE_MB}" >> $GITHUB_OUTPUT
          
          if [ $SIZE_MB -gt ${{ env.DEPLOYMENT_SIZE_THRESHOLD_MB }} ]; then
            echo "⚠️ WARNING: Deployment size exceeds ${DEPLOYMENT_SIZE_THRESHOLD_MB}MB threshold"
            echo "This requires Cloudflare Workers Paid plan ($5/month)"
            echo "Free tier limit: 1MB, Paid tier limit: 5MB"
            # Don't fail - just warn, as paid plan may be configured
          else
            echo "✅ Deployment size within limits"
          fi

      # -------------------------------------------------------------------------
      # Upload Artifacts
      # -------------------------------------------------------------------------
      - name: Upload OpenNext.js build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: |
            .open-next/
            wrangler.toml
            package.json
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # =============================================================================
  # Job 2: Deploy to Cloudflare Workers (Staging)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    
    steps:
      # -------------------------------------------------------------------------
      # Setup
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download OpenNext.js build artifacts
        uses: actions/download-artifact@v4
        with:
          name: opennext-build
          path: .

      # -------------------------------------------------------------------------
      # Update Wrangler Configuration
      # -------------------------------------------------------------------------
      - name: Configure Wrangler for Staging
        run: |
          echo "📝 Configuring Wrangler for Staging deployment..."
          
          # Create temporary wrangler.staging.toml with GitHub Secrets
          cat > wrangler.staging.toml << 'EOF'
          # Auto-generated Wrangler configuration for Staging deployment
          # DO NOT EDIT - Generated during CI/CD deployment
          
          name = "${{ vars.CLOUDFLARE_WORKERS_STAGING_NAME || 'myschoolweb-staging' }}"
          main = ".open-next/worker.js"
          compatibility_date = "2024-10-15"
          compatibility_flags = ["nodejs_compat"]
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          [vars]
          NEXT_PUBLIC_SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          NODE_ENV = "staging"
          EOF
          
          echo "✅ Wrangler configuration created for staging"
          echo "📊 Configuration:"
          echo "  - Worker Name: ${{ vars.CLOUDFLARE_WORKERS_STAGING_NAME || 'myschoolweb-staging' }}"
          echo "  - Account ID: $(echo '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' | cut -c1-10)..."
          echo "  - Supabase URL: ${{ secrets.SUPABASE_URL }}"
          echo "  - Node Environment: staging"

      # -------------------------------------------------------------------------
      # Configure Cloudflare Secrets
      # -------------------------------------------------------------------------
      - name: Set Cloudflare Worker secrets
        run: |
          echo "🔐 Configuring Cloudflare Worker secrets..."
          
          # Set SUPABASE_SERVICE_ROLE_KEY secret
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.staging.toml
          
          # Set SESSION_SECRET secret
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET --config wrangler.staging.toml
          
          echo "✅ Cloudflare Worker secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Deploy to Cloudflare Workers
      # -------------------------------------------------------------------------
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Post-Deployment Verification
      # -------------------------------------------------------------------------
      - name: Post-deployment health check
        run: |
          echo "⏳ Waiting 30 seconds for deployment to propagate..."
          sleep 30
          
          # Get worker URL from Cloudflare
          WORKER_NAME="${{ vars.CLOUDFLARE_WORKERS_STAGING_NAME || 'myschoolweb-staging' }}"
          WORKER_URL="https://${WORKER_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          
          echo "🔍 Health checking: $WORKER_URL"
          
          # Health check the deployed worker
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$WORKER_URL" || echo "000")
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment health check passed"
          else
            echo "⚠️ Deployment health check returned $HTTP_CODE"
            echo "Checking worker logs for errors..."
            npx wrangler tail --config wrangler.staging.toml --once || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # -------------------------------------------------------------------------
      # Create Deployment Summary
      # -------------------------------------------------------------------------
      - name: Create deployment summary
        run: |
          WORKER_NAME="${{ vars.CLOUDFLARE_WORKERS_STAGING_NAME || 'myschoolweb-staging' }}"
          WORKER_URL="https://${WORKER_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          
          echo "## 🚀 Deployment Summary - Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Name:** ${WORKER_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Size:** ${{ needs.build-and-test.outputs.deployment_size_mb }}MB" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**OpenNext.js Version:** ${{ env.OPENNEXT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Steps" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Code quality checks (ESLint, TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Unit and service tests" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Next.js build" >> $GITHUB_STEP_SUMMARY
          echo "- [x] OpenNext.js build for Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Wrangler configuration" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Worker secrets configuration" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Cloudflare Workers deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Post-deployment health check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Application:** ${WORKER_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloudflare Dashboard:** https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/${WORKER_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Supabase Dashboard:** ${{ secrets.SUPABASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Logs:** \`npx wrangler tail --env staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Analytics:** [Cloudflare Dashboard](https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/${WORKER_NAME}/analytics)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 3: Deploy to Cloudflare Workers (Production)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
      # -------------------------------------------------------------------------
      # Setup
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download OpenNext.js build artifacts
        uses: actions/download-artifact@v4
        with:
          name: opennext-build
          path: .

      # -------------------------------------------------------------------------
      # Update Wrangler Configuration
      # -------------------------------------------------------------------------
      - name: Configure Wrangler for Production
        run: |
          echo "📝 Configuring Wrangler for Production deployment..."
          
          # Create temporary wrangler.production.toml with GitHub Secrets
          cat > wrangler.production.toml << 'EOF'
          # Auto-generated Wrangler configuration for Production deployment
          # DO NOT EDIT - Generated during CI/CD deployment
          
          name = "myschoolweb-prod"
          main = ".open-next/worker.js"
          compatibility_date = "2024-10-15"
          compatibility_flags = ["nodejs_compat"]
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          [vars]
          NEXT_PUBLIC_SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          NODE_ENV = "production"
          EOF
          
          echo "✅ Wrangler configuration created for production"

      # -------------------------------------------------------------------------
      # Configure Cloudflare Secrets
      # -------------------------------------------------------------------------
      - name: Set Cloudflare Worker secrets
        run: |
          echo "🔐 Configuring Cloudflare Worker secrets..."
          
          # Set SUPABASE_SERVICE_ROLE_KEY secret
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.production.toml
          
          # Set SESSION_SECRET secret
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET --config wrangler.production.toml
          
          echo "✅ Cloudflare Worker secrets configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Deploy to Cloudflare Workers
      # -------------------------------------------------------------------------
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -------------------------------------------------------------------------
      # Post-Deployment Verification
      # -------------------------------------------------------------------------
      - name: Post-deployment health check
        run: |
          echo "⏳ Waiting 30 seconds for deployment to propagate..."
          sleep 30
          
          WORKER_URL="https://myschoolweb-prod.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          
          echo "🔍 Health checking: $WORKER_URL"
          
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$WORKER_URL" || echo "000")
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment health check passed"
          else
            echo "⚠️ Deployment health check returned $HTTP_CODE"
            echo "Checking worker logs for errors..."
            npx wrangler tail --config wrangler.production.toml --once || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # -------------------------------------------------------------------------
      # Create Deployment Summary
      # -------------------------------------------------------------------------
      - name: Create deployment summary
        run: |
          WORKER_URL="https://myschoolweb-prod.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          
          echo "## 🚀 Deployment Summary - Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Name:** myschoolweb-prod" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Size:** ${{ needs.build-and-test.outputs.deployment_size_mb }}MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Application:** ${WORKER_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloudflare Dashboard:** https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/myschoolweb-prod" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 4: Notify on Failure
  # =============================================================================
  notify-on-failure:
    name: Notify on Failure
    needs: [build-and-test, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Create failure notification
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Failed Jobs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-and-test.result }}" == "failure" ]; then
            echo "- [x] Build and Test: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-staging.result }}" == "failure" ]; then
            echo "- [x] Deploy Staging: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-production.result }}" == "failure" ]; then
            echo "- [x] Deploy Production: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the failed job logs for detailed error information" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix the identified issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Push new commits or re-run the workflow" >> $GITHUB_STEP_SUMMARY
